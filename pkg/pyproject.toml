[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confounderalarm"
version = "0.1.0"
description = "Calibrated spectral alarm for hidden dense confounding in high-dimensional regression, with a predicted detectability frontier and trim-then-regress adjustment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SCF project"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
confounderalarm = "confounderalarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
